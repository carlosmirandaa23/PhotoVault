name: PhotoVault - Codespace tests (self-hosted only)

# Manual execution only. No push/PR triggers and no GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to validate (checkout target)"
        required: true
        type: choice
        options:
          - main
          - develop
        default: main
      rust_tests:
        description: "Run Rust unit tests (requires Tauri Linux dependencies)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: photovault-codespace-tests
  cancel-in-progress: false

jobs:
  tests:
    name: Frontend and optional Rust tests
    runs-on: [self-hosted, linux, x64, photovault-codespace]
    timeout-minutes: 35
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.target_branch }}
      - name: Environment
        run: |
          node --version
          npm --version
          if command -v cargo >/dev/null 2>&1; then cargo --version; else echo 'Cargo unavailable'; fi
      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is not tracked; using npm install without generating a lockfile for this validation."
            npm install --no-package-lock --no-audit --no-fund
          fi
      - name: Build frontend
        run: npm run build
      - name: Generate temporary Tauri test icon when missing
        if: ${{ inputs.rust_tests }}
        run: |
          if [ ! -f src-tauri/icons/icon.png ]; then
            echo "::warning::Tauri icon is missing from Git; generating a temporary test-only PNG."
            mkdir -p src-tauri/icons
            python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          width = height = 32
          pixel = bytes((28, 35, 54, 255))
          raw = b"".join(b"\x00" + pixel * width for _ in range(height))
          def chunk(kind, payload):
              return struct.pack(">I", len(payload)) + kind + payload + struct.pack(">I", zlib.crc32(kind + payload) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          Path("src-tauri/icons/icon.png").write_bytes(png)
          PY
          fi
      - name: Rust unit tests
        if: ${{ inputs.rust_tests }}
        run: |
          . "$HOME/.cargo/env" 2>/dev/null || true
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## PhotoVault validation'
            echo ''
            echo "- Workflow branch: ${GITHUB_REF_NAME}"
            echo "- Tested branch: ${{ inputs.target_branch }}"
            echo "- Tested commit: $(git rev-parse HEAD)"
            echo "- Rust requested: ${{ inputs.rust_tests }}"
            echo "- Runner: self-hosted Codespace (not GitHub-hosted)"
          } >> "$GITHUB_STEP_SUMMARY"
